# Production-like stack: sample (Next.js standalone) + Redis, and golden_pen (no Redis).
#   bun run docker:up      → docker compose up -d   (http://localhost:3000)
#   bun run docker:redis   → only Redis, for `bun run dev`
# Values come from the shell or a root `.env` file (see apps/sample/.env.example; golden_pen
# reads `GOLDEN_PEN_*` overrides, defaults in its service below — http://localhost:3002).
name: next-js-base

services:
  sample:
    build:
      context: .
      dockerfile: apps/sample/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_SITE_INDEXABLE: ${NEXT_PUBLIC_SITE_INDEXABLE:-false}
    image: next-js-base/sample:latest
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    environment:
      API_BASE_URL: ${API_BASE_URL:-https://api.example.test}
      # `enabled` answers the API with the built-in MSW + Faker mock (demo mode).
      # Real deployment: API_MOCKING=disabled and API_BASE_URL=<your API>.
      API_MOCKING: ${API_MOCKING:-enabled}
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-sample:}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:-604800}
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  golden_pen:
    build:
      context: .
      dockerfile: apps/golden_pen/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${GOLDEN_PEN_SITE_URL:-http://localhost:3002}
    image: next-js-base/golden_pen:latest
    restart: unless-stopped
    ports:
      - "${GOLDEN_PEN_PORT:-3002}:3002"
    environment:
      API_BASE_URL: ${GOLDEN_PEN_API_BASE_URL:-http://5.159.49.104:5001}
      # Real API by default. GOLDEN_PEN_API_MOCKING=enabled answers it with the built-in MSW mock
      # (demo mode: 09120000000 / admin123, SMS code 123456).
      API_MOCKING: ${GOLDEN_PEN_API_MOCKING:-disabled}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-86400}
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    ports:
      # Bound to localhost only: reachable by `bun run dev`, not from the network.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  redis-data:
